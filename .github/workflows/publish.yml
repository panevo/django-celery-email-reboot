name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Check version numbers
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(python -c "exec(open('src/djcelery_email/__about__.py').read()); print(__version__)")
        if [ "$version" != "${TAG#v}" ]; then
          echo "::error::Release tag $TAG does not match package version $version"
          exit 1
        fi
        # The newest entry in the changelog must be this version, with a release date
        latest=$(grep -m1 -E "^## \\[" CHANGELOGS.md)
        if ! echo "$latest" | grep -qE "^## \\[${version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
          echo "::error::The newest entry in CHANGELOGS.md is not a dated entry for version $version: $latest"
          exit 1
        fi
    - name: Install dependencies
      run: python -m pip install --upgrade pip build twine
    - name: Build package
      run: python -m build
    - name: Check package
      run: python -m twine check --strict dist/*
    - name: Upload distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-celery-email-reboot/${{ github.event.release.tag_name }}/
    permissions:
      # Required for PyPI trusted publishing
      id-token: write

    steps:
    - name: Download distribution
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
