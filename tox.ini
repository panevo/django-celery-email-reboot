[tox]
requires = tox>=4.22
# Each Django version is tested on its oldest and newest supported Python with
# the latest Celery, and each older Celery version is tested against Django 5.2.
# Keep this list in sync with the matrix in .github/workflows/test.yml
envlist =
    py310-dj42-celery52
    py312-dj42-celery56
    py310-dj50-celery56
    py312-dj50-celery56
    py310-dj51-celery56
    py313-dj51-celery56
    py310-dj52-celery56
    py311-dj52-celery54
    py312-dj52-celery53
    py313-dj52-celery55
    py314-dj52-celery56
    py312-dj60-celery56
    py314-dj60-celery56
    py312-dj61-celery56
    py314-dj61-celery56
    lint

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups = test
deps =
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    celery52: celery>=5.2,<5.3
    celery53: celery>=5.3,<5.4
    celery54: celery>=5.4,<5.5
    celery55: celery>=5.5,<5.6
    celery56: celery>=5.6,<5.7
commands = coverage run -m pytest {posargs}

[testenv:lint]
skip_install = true
dependency_groups = lint
commands = ruff check

[testenv:coverage]
skip_install = true
deps = coverage>=7.10
commands =
    coverage combine
    coverage report
